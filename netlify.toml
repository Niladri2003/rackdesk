# Netlify settings for the landing page in site/. Netlify runs the Astro
# build there and publishes the plain files it writes to site/dist.
[build]
  base = "site"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  ASTRO_TELEMETRY_DISABLED = "1"

# Every file. The page loads scripts, styles, fonts and pictures from its own
# address only, and no other page may show it in a frame.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    Strict-Transport-Security = "max-age=31536000"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"

# Fonts never change under the same name: keep them for 1 year.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Files that the build writes (stylesheet, script, screenshots) have a hash
# of their content in the name. A changed file gets a new name, so the old
# one can be kept for 1 year.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The icons can be replaced under the same name: keep them for 1 day, then
# ask the server if they changed.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

# The pages use the Netlify default: the browser asks on every visit and
# downloads them only when they changed.
