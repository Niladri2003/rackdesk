# cargo-deny: run `cargo deny check` locally and in CI.
[advisories]
yanked = "deny"

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Our own crates depend on each other by path, with no version. Allow that for
# crates that are not published (publish = false).
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
